<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Wrapper-Based Animation Test</title>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    /* Animation pane (like your course window) */
    #animParent {
      position: relative;
      width: 800px;
      height: 400px;
      padding: 25px;
      border: 2px solid #555;
      box-sizing: border-box;
      background: #f5f5f5;
      margin-bottom: 20px;
    }

    /* Outer wrapper – this is what we SLIDE */
    #animated-wrapper {
      position: absolute;
      /* we'll place it with GSAP x/y */
      left: 0;
      top: 0;
      /* just so we can see its box */
      outline: 1px dashed rgba(0,0,0,0.3);
    }

    /* Inner element – this is what we ROTATE / SCALE */
    #animated {
      width: 120px;
      height: 80px;
      background-color: lightcoral;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      padding: 8px 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Wrapper-Based Animation Test</h1>
  <p>
    Outer wrapper (<code>#animated-wrapper</code>) handles <strong>slide</strong>.<br>
    Inner box (<code>#animated</code>) handles <strong>rotation/scale</strong>.
  </p>

  <div id="animParent">
    <div id="animated-wrapper">
      <div id="animated" class="animateMe">
        Box
      </div>
    </div>
  </div>

  <div class="controls">
    <button id="resetBtn">Reset</button>
    <button id="slideRightBtn">Slide Right (to inner edge)</button>
    <button id="slideLeftBtn">Slide Left (to inner edge)</button>
    <button id="rotateBtn">Rotate +45°</button>
    <button id="scaleUpBtn">Scale 1.5x</button>
    <button id="scaleDownBtn">Scale 1x</button>
  </div>

  <script>
    $(function () {

      const $pane    = $("#animParent");
      const $wrapper = $("#animated-wrapper");
      const $inner   = $("#animated");

      // --- INITIAL SETUP ----------------------------------------
      // 1) Measure inner box and place wrapper at a "home" position
      const innerW = $inner.outerWidth();
      const innerH = $inner.outerHeight();

      // We'll define "home" as 50px from left, 60px from top (inside pane)
      const homeX = 50;
      const homeY = 60;

      // Place wrapper so that its top-left is at (homeX, homeY)
      // and size matches the inner element
      $wrapper.css({
        width:  innerW + "px",
        height: innerH + "px"
      });

      // Clear any transform
      gsap.set($wrapper, { x: homeX, y: homeY });
      gsap.set($inner,   { x: 0, y: 0, scale: 1, rotation: 0, transformOrigin: "50% 50%" });

      // store "home" on wrapper so we can reset later if needed
      $wrapper.data("homeX", homeX);
      $wrapper.data("homeY", homeY);
      $wrapper.data("homeW", innerW);
      $wrapper.data("homeH", innerH);

      // --- HELPER: RESET ----------------------------------------
      function resetAll() {
        const hX = $wrapper.data("homeX");
        const hY = $wrapper.data("homeY");
        const hW = $wrapper.data("homeW");
        const hH = $wrapper.data("homeH");

        $wrapper.css({ width: hW + "px", height: hH + "px" });

        gsap.set($wrapper, { x: hX, y: hY });
        gsap.set($inner,   { x: 0, y: 0, scale: 1, rotation: 0 });
      }

      // --- HELPER: SLIDE RIGHT (WRAPPER) ------------------------
      function slideRightFull() {
        const paneW = $pane.innerWidth();       // content width (inside padding)
        const wrapW = $wrapper.outerWidth();    // wrapper width

        // We want wrapper's RIGHT edge to sit at pane's inner RIGHT edge.
        // That means wrapper's x should be: paneW - wrapW
        const targetX = paneW - wrapW;

        gsap.to($wrapper, {
          x: targetX,
          duration: 1,
          ease: "power2.out"
        });
      }

      // --- HELPER: SLIDE LEFT (WRAPPER) -------------------------
      function slideLeftFull() {
        // Left edge = 0 (inner left of pane content)
        const targetX = 0;

        gsap.to($wrapper, {
          x: targetX,
          duration: 1,
          ease: "power2.out"
        });
      }

      // --- HELPER: ROTATE INNER --------------------------------
      function rotateInner(deltaDeg) {
        const current = gsap.getProperty($inner[0], "rotation") || 0;
        gsap.to($inner, {
          rotation: current + deltaDeg,
          duration: 0.6,
          ease: "power2.inOut"
        });
      }

      // --- HELPER: SCALE INNER ---------------------------------
      function scaleInner(targetScale) {
        // wrapper size stays the same in this simple demo
        gsap.to($inner, {
          scale: targetScale,
          duration: 0.6,
          ease: "power1.inOut"
        });
      }

      // --- BUTTON WIRING ----------------------------------------
      $("#resetBtn").on("click", function () {
        resetAll();
      });

      $("#slideRightBtn").on("click", function () {
        slideRightFull();
      });

      $("#slideLeftBtn").on("click", function () {
        slideLeftFull();
      });

      $("#rotateBtn").on("click", function () {
        rotateInner(45); // rotate +45°
      });

      $("#scaleUpBtn").on("click", function () {
        scaleInner(1.5);
      });

      $("#scaleDownBtn").on("click", function () {
        scaleInner(1.0);
      });

    });
  </script>

</body>
</html>
